<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Mickey em RA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- model-viewer: prévia 3D e RA. WebXR (RA dentro do Chrome, via ARCore) vem primeiro porque o
         Scene Viewer do app Google passou a fechar sozinho em alguns aparelhos (nov/2026). -->

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body {
            font-family: 'Encode Sans', sans-serif;
            background-color: #1d2333;
        }
        .ar-button {
            background-color: #3f8cff;
        }
        .ar-button:hover {
            filter: brightness(0.9);
        }
        model-viewer {
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full text-center flex flex-col items-center justify-between h-full">
        <p class="text-lg md:text-xl leading-relaxed mb-4">
            Veja o Mickey escrever com o pincel mágico no seu ambiente.
        </p>

        <div class="w-full aspect-square rounded-lg mb-4 flex items-center justify-center">
            <model-viewer
                id="mv"
                alt="Mickey escrevendo com o pincel mágico"
                src="EpicMickey_AR.glb?v=2"
                autoplay
                ar
                ar-modes="webxr scene-viewer"
                ar-placement="floor"
                ar-scale="auto"
                shadow-intensity="1"
                camera-controls
                camera-orbit="0deg 80deg auto"
                touch-action="pan-y">
                <!-- o botão padrão do model-viewer fica escondido; usamos o nosso abaixo -->
                <button slot="ar-button" style="display:none"></button>
            </model-viewer>
        </div>

        <a href="#" class="ar-button text-white font-bold text-xl md:text-2xl py-4 px-8 rounded-2xl w-full transition-all duration-300 mb-3 shadow-lg" onclick="openAR(); return false;">
            Visualizar em AR
        </a>
        <a href="#" class="text-sm underline opacity-70 mb-2" onclick="openSceneViewer(); return false;">
            Não abriu? Tentar pelo Scene Viewer
        </a>
        <p id="msg" class="text-sm opacity-80 min-h-[1.5rem]"></p>
    </div>

  <script>
    const MODEL = "EpicMickey_AR.glb?v=2";   // troque o v= a cada nova versão do modelo (evita cache do celular)
    const TITLE = "Epic Mickey";
    const mv = document.getElementById("mv");
    const msg = document.getElementById("msg");
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /android/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

    // Caminho principal: o próprio model-viewer abre a RA (WebXR no Chrome; Scene Viewer de reserva).
    function openAR() {
      msg.textContent = "";
      if (isIOS) {
        msg.textContent = "A versão para iPhone (USDZ) ainda não está disponível. Use um Android compatível com ARCore.";
        return;
      }
      if (!isAndroid) {
        msg.textContent = "A Realidade Aumentada funciona em celulares Android compatíveis com ARCore.";
        return;
      }
      if (mv.canActivateAR) {
        mv.activateAR();
      } else {
        openSceneViewer();
      }
    }

    // Caminho alternativo: intent direto para o Scene Viewer do Google Play Services for AR.
    function openSceneViewer() {
      const base = location.origin + location.pathname.replace(/\/[^\/]*$/, '/');
      const params = "file=" + encodeURIComponent(base + MODEL) +
                     "&mode=ar_preferred&title=" + encodeURIComponent(TITLE);
      window.location.href =
        "intent://arvr.google.com/scene-viewer/1.2?" + params +
        "#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;" +
        "S.browser_fallback_url=" + encodeURIComponent(location.href.split('#')[0] + "#ar-falhou") + ";end;";
    }

    mv.addEventListener("ar-status", (e) => {
      if (e.detail.status === "failed") {
        msg.textContent = "O celular não conseguiu abrir a RA. Atualize o \"Google Play Services for AR\" na Play Store e tente de novo.";
      }
    });
    if (location.hash === "#ar-falhou") {
      msg.textContent = "O Scene Viewer não abriu. Atualize o \"Google Play Services for AR\" e o app Google na Play Store.";
    }
  </script>

</body>
</html>
